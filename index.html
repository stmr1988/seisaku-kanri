<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>制作進捗管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;
  --bg2:#f7f7f8;
  --bg3:#f0f0f2;
  --border:#e4e4e7;
  --border2:#d1d1d6;
  --text:#111113;
  --text2:#6b6b7b;
  --text3:#a0a0b0;
  --accent:#111113;
  --accent-bg:#f0f0f2;
  --green:#16a34a;--green-bg:#f0fdf4;--green-border:#bbf7d0;
  --amber:#d97706;--amber-bg:#fffbeb;--amber-border:#fde68a;
  --red:#dc2626;--red-bg:#fef2f2;--red-border:#fecaca;
  --blue:#2563eb;--blue-bg:#eff6ff;--blue-border:#bfdbfe;
  --sans:'Noto Sans JP',sans-serif;
  --mono:'DM Mono',monospace;
  --sidebar:220px;
}
html{font-size:14px}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── LOGIN ── */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg2)}
.lcard{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:40px 44px;width:400px}
.lbrand{display:flex;align-items:center;gap:9px;margin-bottom:28px}
.lbrand-icon{width:30px;height:30px;background:var(--text);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lbrand-icon svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:1.8}
.lbrand-name{font-size:15px;font-weight:700}
.lh1{font-size:20px;font-weight:700;margin-bottom:5px}
.lsub{font-size:13px;color:var(--text2);margin-bottom:28px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.fld input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 13px;color:var(--text);font-size:14px;font-family:var(--sans);outline:none;transition:border-color .15s,box-shadow .15s}
.fld input:focus{border-color:var(--text);box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.lbtn{width:100%;margin-top:6px;padding:11px;background:var(--text);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;font-family:var(--sans);cursor:pointer;transition:opacity .15s,transform .1s}
.lbtn:hover{opacity:.85}
.lbtn:active{transform:scale(.98)}
.lerr{display:none;margin-top:10px;font-size:13px;color:var(--red)}

/* ── APP SHELL ── */
#app{display:none;min-height:100vh;display:none}
.shell{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{
  width:var(--sidebar);flex-shrink:0;
  background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sb-brand{padding:20px 18px 16px;border-bottom:1px solid var(--border)}
.sb-brand-inner{display:flex;align-items:center;gap:8px}
.sb-icon{width:26px;height:26px;background:var(--text);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-icon svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:1.8}
.sb-name{font-size:13px;font-weight:700;line-height:1.3}
.sb-sub{font-size:10px;color:var(--text3);margin-top:1px}
.sb-nav{padding:12px 10px;flex:1}
.sb-section-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;padding:6px 8px 4px}
.sb-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:7px;cursor:pointer;
  font-size:13px;font-weight:500;color:var(--text2);
  transition:background .12s,color .12s;
  border:none;background:none;font-family:var(--sans);width:100%;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sb-item:hover{background:var(--bg3);color:var(--text)}
.sb-item.active{background:var(--bg);color:var(--text);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sb-item svg{width:15px;height:15px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8}
.sb-item-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-divider{height:1px;background:var(--border);margin:8px 10px}
.sb-footer{padding:12px 10px;border-top:1px solid var(--border)}
.sb-footer-btn{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--text2);border:none;background:none;font-family:var(--sans);width:100%;transition:background .12s,color .12s}
.sb-footer-btn:hover{background:var(--bg3);color:var(--text)}
.sb-footer-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}

/* MAIN */
.main-area{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:50px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--bg)}
.topbar-title{font-size:14px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:8px}
.tb-btn{display:flex;align-items:center;gap:5px;padding:6px 11px;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--text2);font-size:12px;font-family:var(--sans);cursor:pointer;transition:all .12s}
.tb-btn:hover{border-color:var(--border2);color:var(--text);background:var(--bg2)}
.tb-btn svg{width:13px;height:13px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8}
.rts{font-size:11px;color:var(--text3);font-family:var(--mono)}
.content{padding:28px 28px;flex:1}

/* STATES */
.loading-wrap{text-align:center;padding:80px 0;color:var(--text2)}
.spinner{width:28px;height:28px;border-radius:50%;border:2px solid var(--border2);border-top-color:var(--text);animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.err-box{background:var(--red-bg);border:1px solid var(--red-border);border-radius:8px;padding:14px 18px;color:var(--red);font-size:13px;line-height:1.7}
.info-box{background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:8px;padding:14px 18px;font-size:13px;line-height:1.8;margin-bottom:20px;color:var(--amber)}
.info-box code{font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px}

/* LIST */
.page-header{margin-bottom:22px}
.page-title{font-size:18px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text2)}
.list-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.swrap{position:relative;flex:1;min-width:180px;max-width:320px}
.swrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text3);pointer-events:none;fill:none;stroke:currentColor;stroke-width:1.8}
.sinput{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 32px;color:var(--text);font-size:13px;font-family:var(--sans);outline:none;transition:border-color .12s}
.sinput:focus{border-color:var(--text)}
.ftabs{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:3px}
.ftab{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;font-family:var(--sans);color:var(--text2);transition:all .12s}
.ftab:hover{color:var(--text)}
.ftab.active{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lmeta{font-size:12px;color:var(--text3);margin-bottom:10px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.pcard{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:18px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.pcard:hover{border-color:var(--border2);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.pc-name{font-size:13px;font-weight:700;line-height:1.4}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.ba{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.bd{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.bh{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.pc-meta{font-size:12px;color:var(--text2);margin-bottom:12px;display:flex;gap:12px;flex-wrap:wrap}
.pc-meta span{color:var(--text);font-weight:600}
.pb-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:4px}
.pb-label b{color:var(--text);font-weight:600;font-family:var(--mono);font-size:11px}
.pbar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:10px}
.pbar-fill{height:100%;border-radius:2px;transition:width .4s ease}
.fg{background:var(--green)}.fa{background:var(--amber)}.fr{background:var(--red)}
.pc-foot{display:flex;gap:12px;flex-wrap:wrap}
.pc-stat{font-size:11px;color:var(--text2)}
.pc-stat b{color:var(--text);font-family:var(--mono);font-size:11px;font-weight:500}

/* DETAIL */
.back-btn{display:inline-flex;align-items:center;gap:5px;background:none;border:none;font-family:var(--sans);color:var(--text2);font-size:13px;cursor:pointer;padding:4px 0;margin-bottom:20px;transition:color .12s}
.back-btn:hover{color:var(--text)}
.back-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.dhead{margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.dname{font-size:20px;font-weight:700;margin-bottom:8px}
.dtags{display:flex;gap:6px;flex-wrap:wrap}
.dtag{font-size:12px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:3px 10px}
.dtag span{color:var(--text);font-weight:600}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--bg2);border-radius:8px;padding:14px 16px}
.klbl{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px}
.kval{font-size:20px;font-weight:700;font-family:var(--mono);letter-spacing:-.5px}
.ksub{font-size:11px;color:var(--text2);margin-top:2px}
.cg{color:var(--green)}.ca{color:var(--amber)}.cr{color:var(--red)}.cb{color:var(--blue)}
.bbc{background:var(--bg2);border-radius:8px;padding:16px 18px;margin-bottom:20px}
.bbchead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.bbctitle{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.3px;text-transform:uppercase}
.bbcpct{font-size:20px;font-weight:700;font-family:var(--mono)}
.bigbar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:8px}
.bigfill{height:100%;border-radius:3px;transition:width .5s ease}
.bbcfoot{display:flex;justify-content:space-between;font-size:12px;color:var(--text2)}
.bbcfoot b{font-family:var(--mono);font-size:11px;color:var(--text);font-weight:500}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:18px}
.tab{padding:9px 16px;font-size:13px;font-weight:600;font-family:var(--sans);color:var(--text2);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--text)}
.tpanel{display:none}
.tpanel.active{display:block}

/* TABLE */
.twrap{border:1px solid var(--border);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{font-size:10px;font-weight:700;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;background:var(--bg2)}
thead th:not(:first-child){text-align:right}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tbody td:not(:first-child){text-align:right}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg2)}
.pno{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:var(--bg3);border-radius:4px;font-size:10px;font-family:var(--mono);color:var(--text2);margin-right:7px;flex-shrink:0}
.pncell{display:flex;align-items:center}
.psub{font-size:11px;color:var(--text2);margin-top:1px}
.mono{font-family:var(--mono);font-size:12px}
.ccost{color:var(--amber);font-family:var(--mono);font-size:12px}
.mbwrap{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.mbar{width:56px;height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;flex-shrink:0}
.mfill{height:100%;border-radius:2px}
.ptxt{font-family:var(--mono);font-size:11px;color:var(--text2);min-width:36px;text-align:right}
.nd{color:var(--text3)}
.lctrl2{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sel{background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;font-family:var(--sans);padding:6px 10px;outline:none}
.sel:focus{border-color:var(--text)}
.srow{display:flex;flex-wrap:wrap;gap:8px}
.schip{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:5px 12px}
.av{width:22px;height:22px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text2);flex-shrink:0}
.cname{font-size:13px;font-weight:600}
.crate{font-family:var(--mono);font-size:11px;color:var(--text2)}
.stitle{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px}

@media(max-width:768px){
  .sidebar{display:none}
  .content{padding:20px 16px}
  .kgrid{grid-template-columns:repeat(2,1fr)}
  thead th:nth-child(n+4),tbody td:nth-child(n+4){display:none}
}
</style>
</head>
<body>

<!-- LOGIN -->

  <div class="lcard">

      <div class="lbrand-icon"><svg viewBox="0 0 18 18"><rect x="1" y="2" width="16" height="14" rx="2.5"/><path d="M5 7h8M5 11h5"/></svg></div>

<script>
// =============================================
//  ★ スプレッドシートIDをここに設定
// =============================================
const SHEET_ID = '1gf5xoG_JhnQvfWnxkrZGGcaiuFh9krHiJecdDlGCUGw';

// =============================================
//  認証
// =============================================
const CRED = { id:'heiwamed', pass:'669966' };
let DATA = null;
let curFilter = 'all';
let curSearch = '';
let curProject = null;

function doLogin() {
  const id = document.getElementById('uid').value.trim();
  const pw = document.getElementById('upw').value;
  if (id === CRED.id && pw === CRED.pass) {
    sessionStorage.setItem('auth','1');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadData();
  } else {
    document.getElementById('lerr').style.display = 'block';
  }
}
document.getElementById('lbtn').onclick = doLogin;
document.getElementById('upw').onkeydown = e => { if(e.key==='Enter') doLogin(); };
document.getElementById('logout-btn').onclick = () => { sessionStorage.removeItem('auth'); location.reload(); };
document.getElementById('reload-btn').onclick = loadData;
document.getElementById('back-btn').onclick = showList;

if (sessionStorage.getItem('auth')==='1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

// =============================================
//  スプレッドシート読み込み（gviz方式）
// =============================================
async function fetchSheet(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`シート「${sheetName}」の取得失敗`);
  const text = await res.text();
  return parseCSV(text);
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  return lines.map(line => {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += c; }
    }
    cols.push(cur.trim());
    return cols;
  });
}

// =============================================
//  データ取得・整形
// =============================================
async function loadData() {
  setLC(loadingHTML());
  if (SHEET_ID === 'YOUR_SHEET_ID_HERE') { showDemo(); return; }

  try {
    // configシート読み込み
    const configRows = await fetchSheet('config');
    const staffMap = {};
    for (let i = 1; i < configRows.length; i++) {
      const name = configRows[i][0] || '';
      const rate = Number(configRows[i][1] || 0);
      if (name) staffMap[name] = rate;
    }

    // シート一覧はスプレッドシートから取得できないため
    // configシートのE列に案件シート名一覧を記載する方式
    // E列: 案件シート名（2行目以降）
const indexRows = await fetchSheet('index');
    const projectSheetNames = [];
    for (let i = 1; i < indexRows.length; i++) {
      const sn = indexRows[i][0] || '';
      if (sn) projectSheetNames.push(sn.trim());
    }

    const projects = [];
    for (const sn of projectSheetNames) {
      try {
        const p = await parseProjectSheet(sn, staffMap);
        if (p) projects.push(p);
      } catch(e) {
        console.log('Skip:', sn, e.message);
      }
    }

    DATA = { projects };
    stamp();
    renderSidebar();
    renderList();
  } catch(e) {
    setLC(`<div class="err-box">⚠ データ取得エラー: ${e.message}<br><small style="opacity:.7;display:block;margin-top:4px">スプレッドシートの共有設定と構成を確認してください</small></div>`);
  }
}

async function parseProjectSheet(sheetName, staffMap) {
  const rows = await fetchSheet(sheetName);
  if (rows.length < 2) return null;

  const name         = rows[0][1] || '';
  const manager      = rows[1][1] || '';
  const status       = rows[2][1] || '進行中';
  const budget       = Number(rows[3][1] || 0);
  const targetBudget = Number(rows[4][1] || 0);
  if (!name) return null;

  const procAssignees = {};
  for (let i = 7; i < rows.length; i++) {
    const pn = rows[i][0] || '';
    const pa = rows[i][1] || '';
    if (pn) procAssignees[pn] = pa;
  }

  // ログシート読み込み
  let logs = [];
  try {
    const logRows = await fetchSheet(sheetName + '_log');
    for (let i = 1; i < logRows.length; i++) {
      const r = logRows[i];
      const date     = r[0] || '';
      const process  = r[1] || '';
      const assignee = r[2] || '';
      const hours    = Number(r[3] || 0);
      if (!process || !assignee || !hours) continue;
      const hourlyRate = staffMap[assignee] || 0;
      const cost = Math.round(hours * hourlyRate);
      logs.push({ date, process, assignee, hours, hourlyRate, cost });
    }
  } catch(e) { /* ログシートなし */ }

  // 工程ごとに集計
  const procMap = {};
  for (const log of logs) {
    if (!log.process) continue;
    if (!procMap[log.process]) procMap[log.process] = { hours:0, cost:0 };
    procMap[log.process].hours += log.hours;
    procMap[log.process].cost  += log.cost;
  }

  const PROC_NAMES = ['契約','ヒアリングシート回収','サイトマップ作成','ディレクトリマップ作成','トップページWF作成','下層ページテキスト作成','トップページデザイン','下層ページデザイン','トップページ実装','下層ページ実装','公開','GSC・GA4設定'];
  const processes = PROC_NAMES.map(pn => ({
    name: pn,
    assignee: procAssignees[pn] || '',
    hours: Math.round((procMap[pn]?.hours||0)*10)/10,
    cost:  Math.round(procMap[pn]?.cost||0),
  }));

  const usedCost = processes.reduce((s,p) => s+p.cost, 0);
  const staffSet = {};
  for (const log of logs) {
    if (log.assignee && !staffSet[log.assignee]) staffSet[log.assignee] = staffMap[log.assignee]||0;
  }
  const staff = Object.entries(staffSet).map(([name,rate])=>({name,hourlyRate:rate}));

  return { sheetName, name, manager, status, budget, targetBudget, usedCost, processes, staff, logs };
}

function setLC(html) { document.getElementById('lcontent').innerHTML = html; }

document.querySelectorAll('.ftab').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.ftab').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); curFilter = b.dataset.f; renderList();
  };
});
document.getElementById('sinput').oninput = e => { curSearch = e.target.value.trim().toLowerCase(); renderList(); };

function filterP(ps) {
  return ps.filter(p => {
    const mf = curFilter==='all'?true:curFilter==='active'?(!p.status||p.status==='進行中'):curFilter==='done'?p.status==='完了':p.status==='保留';
    const ms = !curSearch || p.name.toLowerCase().includes(curSearch)||(p.manager||'').toLowerCase().includes(curSearch);
    return mf && ms;
  });
}

function renderList() {
  if (!DATA) return;
  const ps = filterP(DATA.projects||[]);
  document.getElementById('page-sub').textContent = `全 ${DATA.projects.length} 件`;
  document.getElementById('lmeta').textContent = ps.length + ' 件表示';
  if (!ps.length) { setLC(`<div class="loading-wrap" style="padding:40px 0;font-size:13px">該当する案件がありません</div>`); return; }
  setLC(`<div class="cgrid">${ps.map(pcHTML).join('')}</div>`);
  document.querySelectorAll('.pcard').forEach(c => { c.onclick = () => showDetail(c.dataset.s); });
}

function pcHTML(p) {
  const pct = p.targetBudget>0?Math.min((p.usedCost/p.targetBudget)*100,100):0;
  const rem = p.targetBudget - p.usedCost;
  const fc  = pct>=90?'fr':pct>=70?'fa':'fg';
  const bc  = p.status==='完了'?'bd':p.status==='保留'?'bh':'ba';
  return `<div class="pcard" data-s="${x(p.sheetName)}">
    <div class="pc-top"><div class="pc-name">${x(p.name)}</div><div class="badge ${bc}">${p.status||'進行中'}</div></div>
    <div class="pc-meta"><div>担当 <span>${x(p.manager||'未設定')}</span></div><div>制作費 <span>¥${f(p.budget)}</span></div></div>
    <div class="pb-label"><span>目標予算消化率</span><b>${Math.round(pct)}%</b></div>
    <div class="pbar"><div class="pbar-fill ${fc}" style="width:${pct}%"></div></div>
    <div class="pc-foot">
      <div class="pc-stat">使用 <b>¥${f(p.usedCost)}</b></div>
      <div class="pc-stat">目標 <b>¥${f(p.targetBudget)}</b></div>
      <div class="pc-stat">残 <b style="color:${rem<0?'var(--red)':'var(--green)'}">¥${f(rem)}</b></div>
    </div>
  </div>`;
}

function showDetail(sn) {
  const p = (DATA.projects||[]).find(q=>q.sheetName===sn);
  if (!p) return;
  curProject = p;
  document.getElementById('list-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';
  document.getElementById('topbar-title').textContent = p.name;
  setSidebarActive(sn);
  document.getElementById('dcontent').innerHTML = buildDetail(p);
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      document.querySelectorAll('.tab').forEach(u=>u.classList.remove('active'));
      document.querySelectorAll('.tpanel').forEach(u=>u.classList.remove('active'));
      t.classList.add('active');
      const pn = document.getElementById('tp-'+t.dataset.t);
      if (pn) pn.classList.add('active');
      if (t.dataset.t==='log') renderLog(p);
    };
  });
  ['log-pf','log-sf'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.onchange = () => renderLog(p);
  });
}

const PROCS = ['契約','ヒアリングシート回収','サイトマップ作成','ディレクトリマップ作成','トップページWF作成','下層ページテキスト作成','トップページデザイン','下層ページデザイン','トップページ実装','下層ページ実装','公開','GSC・GA4設定'];

function buildDetail(p) {
  const used = p.usedCost||0;
  const rem  = p.targetBudget - used;
  const brem = p.budget - used;
  const pct  = p.targetBudget>0?(used/p.targetBudget)*100:0;
  const pcap = Math.min(pct,100);
  const fc   = pct>=90?'fr':pct>=70?'fa':'fg';
  const th   = (p.processes||[]).reduce((s,q)=>s+(q.hours||0),0);
  const bc   = p.status==='完了'?'bd':p.status==='保留'?'bh':'ba';

  const kpis = `
    <div class="kpi"><div class="klbl">制作費（受注額）</div><div class="kval">¥${f(p.budget)}</div></div>
    <div class="kpi"><div class="klbl">目標予算</div><div class="kval">¥${f(p.targetBudget)}</div><div class="ksub">制作費の${p.budget>0?Math.round(p.targetBudget/p.budget*100):'—'}%</div></div>
    <div class="kpi"><div class="klbl">使用人件費</div><div class="kval ca">¥${f(used)}</div><div class="ksub">合計 ${th}h</div></div>
    <div class="kpi"><div class="klbl">目標予算 残り</div><div class="kval ${rem<0?'cr':'cg'}">¥${f(rem)}</div><div class="ksub">${rem<0?'⚠ 超過中':'残り '+(100-Math.round(pcap))+'%'}</div></div>
    <div class="kpi"><div class="klbl">制作費 残り</div><div class="kval ${brem<0?'cr':'cb'}">¥${f(brem)}</div><div class="ksub">粗利の目安</div></div>`;

  const prows = PROCS.map((pn,i)=>{
    const pr = (p.processes||[]).find(q=>q.name===pn)||{};
    const h=pr.hours||0, c=pr.cost||0;
    const pp = p.targetBudget>0?(c/p.targetBudget)*100:0;
    const mfc= pp>=20?'fr':pp>=10?'fa':'fg';
    return `<tr>
      <td><div class="pncell"><span class="pno">${i+1}</span><div><div>${x(pn)}</div><div class="psub">${x(pr.assignee||'未設定')}</div></div></div></td>
      <td>${h>0?`<span class="mono">${h}h</span>`:'<span class="nd">—</span>'}</td>
      <td>${c>0?`<span class="ccost">¥${f(c)}</span>`:'<span class="nd">—</span>'}</td>
      <td>${c>0?`<div class="mbwrap"><div class="mbar"><div class="mfill ${mfc}" style="width:${Math.min(pp*3,100)}%"></div></div><span class="ptxt">${pp.toFixed(1)}%</span></div>`:'<span class="nd" style="font-size:11px">—</span>'}</td>
    </tr>`;
  }).join('');

  const staffH = (p.staff||[]).map(s=>`
    <div class="schip"><div class="av">${s.name.slice(0,2)}</div><span class="cname">${x(s.name)}</span><span class="crate">¥${f(s.hourlyRate)}/h</span></div>`).join('');

  const pOpts = ['すべての工程',...PROCS].map((n,i)=>`<option value="${i===0?'':n}">${x(n)}</option>`).join('');
  const sNames = [...new Set((p.logs||[]).map(l=>l.assignee).filter(Boolean))];
  const sOpts  = ['すべての担当者',...sNames].map((n,i)=>`<option value="${i===0?'':n}">${x(n)}</option>`).join('');

  return `
    <div class="dhead">
      <div class="dname">${x(p.name)}</div>
      <div class="dtags">
        <div class="dtag"><span class="badge ${bc}" style="border-radius:4px">${p.status||'進行中'}</span></div>
        <div class="dtag">メイン担当 <span>${x(p.manager||'未設定')}</span></div>
      </div>
    </div>
    <div class="kgrid">${kpis}</div>
    <div class="bbc">
      <div class="bbchead"><div class="bbctitle">目標予算 消化率</div><div class="bbcpct ${pct>=90?'cr':pct>=70?'ca':'cg'}">${Math.round(pct)}%</div></div>
      <div class="bigbar"><div class="bigfill ${fc}" style="width:${pcap}%"></div></div>
      <div class="bbcfoot"><span>使用 <b>¥${f(used)}</b></span><span>目標予算 <b>¥${f(p.targetBudget)}</b></span></div>
    </div>
    <div class="tabs">
      <button class="tab active" data-t="processes">工程別サマリー</button>
      <button class="tab" data-t="log">日別作業ログ</button>
      <button class="tab" data-t="staff">担当者</button>
    </div>
    <div id="tp-processes" class="tpanel active">
      <div class="twrap"><table>
        <thead><tr><th>工程</th><th>作業時間</th><th>人件費</th><th>予算消化</th></tr></thead>
        <tbody>${prows}</tbody>
      </table></div>
    </div>
    <div id="tp-log" class="tpanel">
      <div class="lctrl2">
        <select class="sel" id="log-pf">${pOpts}</select>
        <select class="sel" id="log-sf">${sOpts}</select>
      </div>
      <div id="log-wrap"></div>
    </div>
    <div id="tp-staff" class="tpanel">
      <div class="stitle">この案件の担当者</div>
      <div class="srow">${staffH||'<span style="color:var(--text2);font-size:13px">担当者情報がありません</span>'}</div>
    </div>`;
}

function renderLog(p) {
  const pf = (document.getElementById('log-pf')||{}).value||'';
  const sf = (document.getElementById('log-sf')||{}).value||'';
  let logs = (p.logs||[]).filter(l=>(!pf||l.process===pf)&&(!sf||l.assignee===sf));
  logs.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const wrap = document.getElementById('log-wrap');
  if (!wrap) return;
  if (!logs.length) { wrap.innerHTML=`<div class="loading-wrap" style="padding:32px 0;font-size:13px">作業ログがありません</div>`; return; }
  const th = logs.reduce((s,l)=>s+(l.hours||0),0);
  const tc = logs.reduce((s,l)=>s+(l.cost||0),0);
  wrap.innerHTML=`<div class="twrap"><table>
    <thead><tr><th>日付</th><th>工程</th><th>担当者</th><th>時間</th><th>人件費</th></tr></thead>
    <tbody>
      ${logs.map(l=>`<tr><td><span class="mono">${x(l.date||'—')}</span></td><td>${x(l.process||'—')}</td><td>${x(l.assignee||'—')}</td><td><span class="mono">${l.hours||0}h</span></td><td><span class="ccost">¥${f(l.cost||0)}</span></td></tr>`).join('')}
      <tr style="background:var(--bg2)"><td colspan="3" style="text-align:right;font-size:11px;color:var(--text2);font-weight:700;letter-spacing:.4px;text-transform:uppercase">合計</td><td><span class="mono" style="font-weight:600">${th}h</span></td><td><span class="ccost" style="font-weight:600">¥${f(tc)}</span></td></tr>
    </tbody>
  </table></div>`;
}
