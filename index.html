<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>制作進捗管理</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0d10;--bg2:#13141a;--bg3:#1a1b23;--bg4:#22232e;
  --border:#2a2b38;--border2:#363748;
  --text:#e2e4f0;--text2:#7e8199;--text3:#50526a;
  --accent:#4f7fff;--accent-h:#6b94ff;--accent-bg:#4f7fff18;
  --green:#34d399;--green-bg:#34d39912;
  --amber:#fbbf24;--amber-bg:#fbbf2412;
  --red:#f87171;--red-bg:#f8717112;
  --blue:#60a5fa;--teal:#2dd4bf;
  --sans:'Outfit','Noto Sans JP',sans-serif;
  --mono:'DM Mono',monospace;
  --r:10px;--r2:14px;
}
html{font-size:14px}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden}
.lg-a{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,#4f7fff1a 0%,transparent 70%);top:-120px;left:-80px;pointer-events:none}
.lg-b{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,#2dd4bf0e 0%,transparent 70%);bottom:-60px;right:0;pointer-events:none}
.lcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:44px 48px;width:420px;position:relative;z-index:1}
.lbrand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.bicon{width:34px;height:34px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bicon svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.8}
.bname{font-size:17px;font-weight:700;letter-spacing:-.2px}
.lh1{font-size:22px;font-weight:700;margin-bottom:6px}
.lsub{font-size:13px;color:var(--text2);margin-bottom:32px}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.6px;text-transform:uppercase;margin-bottom:7px}
.fld input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:11px 14px;color:var(--text);font-size:14px;font-family:var(--sans);outline:none;transition:border-color .15s,box-shadow .15s}
.fld input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.lbtn{width:100%;margin-top:8px;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:700;font-family:var(--sans);cursor:pointer;letter-spacing:.3px;transition:background .15s,transform .1s}
.lbtn:hover{background:var(--accent-h)}
.lbtn:active{transform:scale(.98)}
.lerr{display:none;margin-top:10px;font-size:13px;color:var(--red)}

/* APP */
#app{display:none;min-height:100vh}
.topbar{height:54px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:200}
.tbl{display:flex;align-items:center;gap:12px}
.tbrand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.tbrand .bicon{width:26px;height:26px;border-radius:6px}
.tbrand .bicon svg{width:14px;height:14px}
.tbr{display:flex;align-items:center;gap:8px}
.tbbtn{display:flex;align-items:center;gap:5px;padding:6px 11px;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--text2);font-size:12px;font-family:var(--sans);cursor:pointer;transition:all .15s}
.tbbtn:hover{border-color:var(--border2);color:var(--text)}
.tbbtn svg{width:13px;height:13px;flex-shrink:0}
.rts{font-size:11px;color:var(--text3);font-family:var(--mono)}
.page{padding:24px 20px;max-width:1300px;margin:0 auto}

/* STATES */
.loading-wrap{text-align:center;padding:80px 0;color:var(--text2)}
.spinner{width:30px;height:30px;border-radius:50%;border:2px solid var(--border2);border-top-color:var(--accent);animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.err-box{background:var(--red-bg);border:1px solid #f8717130;border-radius:var(--r);padding:16px 20px;color:var(--red);font-size:13px;line-height:1.7}
.setup-box{background:var(--amber-bg);border:1px solid #fbbf2430;border-radius:var(--r);padding:18px 20px;font-size:13px;line-height:1.8;margin-bottom:20px}
.setup-box code{font-family:var(--mono);font-size:12px;background:var(--bg4);padding:1px 5px;border-radius:4px;color:var(--amber)}

/* LIST */
.lctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.swrap{position:relative;flex:1;min-width:200px;max-width:360px}
.swrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text3);pointer-events:none;fill:none;stroke:currentColor;stroke-width:1.8}
.sinput{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:8px 12px 8px 33px;color:var(--text);font-size:13px;font-family:var(--sans);outline:none;transition:border-color .15s}
.sinput:focus{border-color:var(--accent)}
.ftabs{display:flex;gap:4px}
.ftab{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .15s;background:transparent;font-family:var(--sans);color:var(--text2)}
.ftab:hover{background:var(--bg3);color:var(--text)}
.ftab.active{background:var(--accent-bg);border-color:#4f7fff40;color:var(--accent-h)}
.lmeta{font-size:12px;color:var(--text3);margin-bottom:8px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:18px 20px;cursor:pointer;transition:border-color .15s,transform .15s;position:relative;overflow:hidden}
.pcard:hover{border-color:var(--border2);transform:translateY(-1px)}
.pcard:hover::after{opacity:1}
.pcard::after{content:'';position:absolute;inset:0;border-radius:var(--r2);background:linear-gradient(135deg,#4f7fff06 0%,transparent 60%);opacity:0;transition:opacity .2s}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}
.pc-name{font-size:14px;font-weight:700;line-height:1.35}
.badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.ba{background:var(--green-bg);color:var(--green);border:1px solid #34d39928}
.bd{background:var(--accent-bg);color:var(--accent-h);border:1px solid #4f7fff28}
.bh{background:var(--amber-bg);color:var(--amber);border:1px solid #fbbf2428}
.pc-meta{font-size:12px;color:var(--text2);margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap}
.pc-meta span{color:var(--text);font-weight:600}
.pb-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:5px}
.pb-label b{color:var(--text2);font-weight:500;font-family:var(--mono);font-size:11px}
.pbar{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-bottom:10px}
.pbar-fill{height:100%;border-radius:3px;transition:width .4s ease}
.fg{background:var(--green)}.fa{background:var(--amber)}.fr{background:var(--red)}
.pc-foot{display:flex;gap:14px}
.pc-stat{font-size:11px;color:var(--text3)}
.pc-stat b{color:var(--text2);font-family:var(--mono);font-size:11px;font-weight:500}

/* DETAIL */
#detail-view{display:none}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;font-family:var(--sans);color:var(--text2);font-size:13px;cursor:pointer;padding:4px 0;margin-bottom:22px;transition:color .15s}
.back-btn:hover{color:var(--text)}
.back-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.dhead{margin-bottom:22px}
.dname{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-bottom:8px}
.dtags{display:flex;gap:8px;flex-wrap:wrap}
.dtag{font-size:12px;color:var(--text2);background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 12px}
.dtag span{color:var(--text);font-weight:600}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.klbl{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.kval{font-size:21px;font-weight:700;font-family:var(--mono);letter-spacing:-.5px}
.ksub{font-size:11px;color:var(--text3);margin-top:2px}
.cg{color:var(--green)}.ca{color:var(--amber)}.cr{color:var(--red)}.cb{color:var(--blue)}.ct{color:var(--teal)}
.bbc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:22px}
.bbchead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.bbctitle{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.3px;text-transform:uppercase}
.bbcpct{font-size:22px;font-weight:700;font-family:var(--mono)}
.bigbar{height:8px;background:var(--bg4);border-radius:4px;overflow:hidden;margin-bottom:10px}
.bigfill{height:100%;border-radius:4px;transition:width .5s ease}
.bbcfoot{display:flex;justify-content:space-between;font-size:12px;color:var(--text3)}
.bbcfoot b{font-family:var(--mono);font-size:11px;color:var(--text2);font-weight:500}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:10px 16px;font-size:13px;font-weight:600;font-family:var(--sans);color:var(--text2);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent-h);border-bottom-color:var(--accent)}
.tpanel{display:none}
.tpanel.active{display:block}
.twrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;padding:11px 14px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
thead th:not(:first-child){text-align:right}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tbody td:not(:first-child){text-align:right}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg3)}
.pno{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;background:var(--bg4);border-radius:4px;font-size:10px;font-family:var(--mono);color:var(--text3);margin-right:7px;flex-shrink:0}
.pncell{display:flex;align-items:center}
.psub{font-size:11px;color:var(--text3);margin-top:1px}
.mono{font-family:var(--mono);font-size:12px}
.ccost{color:var(--amber);font-family:var(--mono);font-size:12px}
.mbwrap{display:flex;align-items:center;gap:7px;justify-content:flex-end}
.mbar{width:60px;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;flex-shrink:0}
.mfill{height:100%;border-radius:2px}
.ptxt{font-family:var(--mono);font-size:11px;color:var(--text2);min-width:38px;text-align:right}
.nd{color:var(--text3)}
.lctrl2{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sel{background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;font-family:var(--sans);padding:7px 10px;outline:none}
.sel:focus{border-color:var(--accent)}
.srow{display:flex;flex-wrap:wrap;gap:8px}
.schip{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:6px 14px}
.av{width:22px;height:22px;border-radius:50%;background:var(--accent-bg);border:1px solid #4f7fff50;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--accent-h);flex-shrink:0}
.cname{font-size:13px;font-weight:600}
.crate{font-family:var(--mono);font-size:11px;color:var(--text2)}
.stitle{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px}
@media(max-width:640px){
  .page{padding:16px 14px}
  .lcard{width:calc(100vw - 32px);padding:32px 24px}
  .kgrid{grid-template-columns:repeat(2,1fr)}
  thead th:nth-child(n+4),tbody td:nth-child(n+4){display:none}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="lg-a"></div><div class="lg-b"></div>
  <div class="lcard">
    <div class="lbrand">
      <div class="bicon"><svg viewBox="0 0 18 18"><rect x="1" y="2" width="16" height="14" rx="2.5"/><path d="M5 7h8M5 11h5"/></svg></div>
      <span class="bname">制作進捗管理</span>
    </div>
    <div class="lh1">ログイン</div>
    <div class="lsub">IDとパスワードを入力してください</div>
    <div class="fld">
      <label for="uid">ユーザーID</label>
      <input type="text" id="uid" placeholder="heiwamed" autocomplete="username">
    </div>
    <div class="fld">
      <label for="upw">パスワード</label>
      <input type="password" id="upw" placeholder="••••••" autocomplete="current-password">
    </div>
    <button class="lbtn" id="lbtn">ログイン</button>
    <div class="lerr" id="lerr">IDまたはパスワードが正しくありません</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="tbl">
      <div class="tbrand">
        <div class="bicon"><svg viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.8"><rect x="1" y="2" width="16" height="14" rx="2.5"/><path d="M5 7h8M5 11h5"/></svg></div>
        制作進捗管理
      </div>
      <span class="rts" id="rts"></span>
    </div>
    <div class="tbr">
      <button class="tbbtn" id="reload-btn">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 16 16"><path d="M13.5 8A5.5 5.5 0 1 1 8 2.5c1.8 0 3.4.9 4.5 2.2M13.5 2v3h-3"/></svg>
        更新
      </button>
      <button class="tbbtn" id="logout-btn">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 16 16"><path d="M10 8H2M5 5l-3 3 3 3M10 2h2.5A1.5 1.5 0 0 1 14 3.5v9A1.5 1.5 0 0 1 12.5 14H10"/></svg>
        ログアウト
      </button>
    </div>
  </div>

  <div class="page">
    <div id="list-view">
      <div class="lctrl">
        <div class="swrap">
          <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></svg>
          <input type="search" class="sinput" id="sinput" placeholder="案件名・担当者で検索...">
        </div>
        <div class="ftabs">
          <button class="ftab active" data-f="all">すべて</button>
          <button class="ftab" data-f="active">進行中</button>
          <button class="ftab" data-f="done">完了</button>
          <button class="ftab" data-f="hold">保留</button>
        </div>
      </div>
      <div class="lmeta" id="lmeta"></div>
      <div id="lcontent"></div>
    </div>

    <div id="detail-view">
      <button class="back-btn" id="back-btn">
        <svg viewBox="0 0 16 16"><path d="M10 3L4 8l6 5"/></svg>
        案件一覧に戻る
      </button>
      <div id="dcontent"></div>
    </div>
  </div>
</div>

<script>
// ★ GAS URLをここに設定
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxx70eBaMPNhYGqnHqT41gSJ4c0SaVoc3CTd-S4FEzT81Vht7kTwzqFp7-Wcsp1cYNb/exec';
const CRED = { id:'heiwamed', pass:'669966' };

let DATA = null;
let curFilter = 'all';
let curSearch = '';
let curProject = null;

// ── AUTH ──
function doLogin() {
  const id = document.getElementById('uid').value.trim();
  const pw = document.getElementById('upw').value;
  if (id === CRED.id && pw === CRED.pass) {
    sessionStorage.setItem('auth','1');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadData();
  } else {
    document.getElementById('lerr').style.display = 'block';
  }
}
document.getElementById('lbtn').onclick = doLogin;
document.getElementById('upw').onkeydown = e => { if(e.key==='Enter') doLogin(); };
document.getElementById('logout-btn').onclick = () => { sessionStorage.removeItem('auth'); location.reload(); };
document.getElementById('reload-btn').onclick = loadData;
document.getElementById('back-btn').onclick = showList;

if (sessionStorage.getItem('auth')==='1') {
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
}

// ── DATA ──
async function loadData() {
  setLC(loadingHTML());
  try {
    if (GAS_URL === 'https://script.google.com/macros/s/AKfycbxx70eBaMPNhYGqnHqT41gSJ4c0SaVoc3CTd-S4FEzT81Vht7kTwzqFp7-Wcsp1cYNb/exec') { showDemo(); return; }
    const r = await fetch(GAS_URL + '?action=all&t=' + Date.now());
    const j = await r.json();
    if (!j.ok) throw new Error(j.error||'エラー');
    DATA = j.data;
    stamp();
    renderList();
  } catch(e) {
    setLC(`<div class="err-box">⚠ データ取得エラー: ${e.message}<br><small style="opacity:.7;display:block;margin-top:4px">GAS URLとスプレッドシート構成を確認してください</small></div>`);
  }
}

function stamp() {
  document.getElementById('rts').textContent = '最終更新 ' + new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
}
function setLC(html) { document.getElementById('lcontent').innerHTML = html; }
function loadingHTML() { return `<div class="loading-wrap"><div class="spinner"></div><div>読み込み中...</div></div>`; }

// ── LIST ──
function showList() {
  document.getElementById('list-view').style.display='block';
  document.getElementById('detail-view').style.display='none';
}

document.querySelectorAll('.ftab').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.ftab').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    curFilter = b.dataset.f;
    renderList();
  };
});
document.getElementById('sinput').oninput = e => { curSearch = e.target.value.trim().toLowerCase(); renderList(); };

function filterP(ps) {
  return ps.filter(p => {
    const mf = curFilter==='all' ? true : curFilter==='active' ? (!p.status||p.status==='進行中') : curFilter==='done' ? p.status==='完了' : p.status==='保留';
    const ms = !curSearch || p.name.toLowerCase().includes(curSearch) || (p.manager||'').toLowerCase().includes(curSearch);
    return mf && ms;
  });
}

function renderList() {
  if (!DATA) return;
  const ps = filterP(DATA.projects||[]);
  document.getElementById('lmeta').textContent = ps.length + ' 件表示';
  if (!ps.length) { setLC(`<div class="loading-wrap" style="padding:40px 0;font-size:13px">該当する案件がありません</div>`); return; }
  setLC(`<div class="cgrid">${ps.map(pcHTML).join('')}</div>`);
  document.querySelectorAll('.pcard').forEach(c => { c.onclick = () => showDetail(c.dataset.s); });
}

function pcHTML(p) {
  const pct = p.targetBudget>0 ? Math.min((p.usedCost/p.targetBudget)*100,100) : 0;
  const rem = p.targetBudget - p.usedCost;
  const fc  = pct>=90?'fr':pct>=70?'fa':'fg';
  const bc  = p.status==='完了'?'bd':p.status==='保留'?'bh':'ba';
  const sl  = p.status||'進行中';
  return `<div class="pcard" data-s="${x(p.sheetName)}">
    <div class="pc-top"><div class="pc-name">${x(p.name)}</div><div class="badge ${bc}">${sl}</div></div>
    <div class="pc-meta"><div>担当 <span>${x(p.manager||'未設定')}</span></div><div>制作費 <span>¥${f(p.budget)}</span></div></div>
    <div class="pb-label"><span>目標予算消化率</span><b>${Math.round(pct)}%</b></div>
    <div class="pbar"><div class="pbar-fill ${fc}" style="width:${pct}%"></div></div>
    <div class="pc-foot">
      <div class="pc-stat">使用 <b>¥${f(p.usedCost)}</b></div>
      <div class="pc-stat">目標 <b>¥${f(p.targetBudget)}</b></div>

// ── DETAIL ──
function showDetail(sn) {
  const p = (DATA.projects||[]).find(q => q.sheetName===sn);
  if (!p) return;
  curProject = p;
  document.getElementById('list-view').style.display='none';
  document.getElementById('detail-view').style.display='block';
  document.getElementById('dcontent').innerHTML = buildDetail(p);
  // tabs
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      document.querySelectorAll('.tab').forEach(u=>u.classList.remove('active'));
      document.querySelectorAll('.tpanel').forEach(u=>u.classList.remove('active'));
      t.classList.add('active');
      const pn = document.getElementById('tp-'+t.dataset.t);
      if (pn) pn.classList.add('active');
      if (t.dataset.t==='log') renderLog(p);
    };
  });
  // log filters
  ['log-pf','log-sf'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.onchange = () => renderLog(p);
  });
}

const PROCS = ['契約','ヒアリングシート回収','サイトマップ作成','ディレクトリマップ作成','トップページWF作成','下層ページテキスト作成','トップページデザイン','下層ページデザイン','トップページ実装','下層ページ実装','公開','GSC・GA4設定'];

function buildDetail(p) {
  const used = p.usedCost||0;
  const rem  = p.targetBudget - used;
  const brem = p.budget - used;
  const pct  = p.targetBudget>0 ? (used/p.targetBudget)*100 : 0;
  const pcap = Math.min(pct,100);
  const fc   = pct>=90?'fr':pct>=70?'fa':'fg';
  const th   = (p.processes||[]).reduce((s,q)=>s+(q.hours||0),0);
  const bc   = p.status==='完了'?'bd':p.status==='保留'?'bh':'ba';

  const kpis = `
    <div class="kpi"><div class="klbl">制作費（受注額）</div><div class="kval">¥${f(p.budget)}</div></div>
    <div class="kpi"><div class="klbl">目標予算</div><div class="kval">¥${f(p.targetBudget)}</div><div class="ksub">制作費の${p.budget>0?Math.round(p.targetBudget/p.budget*100):'—'}%</div></div>
    <div class="kpi"><div class="klbl">使用人件費</div><div class="kval ca">¥${f(used)}</div><div class="ksub">合計 ${th}h</div></div>
    <div class="kpi"><div class="klbl">目標予算 残り</div><div class="kval ${rem<0?'cr':'cg'}">¥${f(rem)}</div><div class="ksub">${rem<0?'⚠ 超過中':'残り '+(100-Math.round(pcap))+'%'}</div></div>
    <div class="kpi"><div class="klbl">制作費 残り</div><div class="kval ${brem<0?'cr':'ct'}">¥${f(brem)}</div><div class="ksub">粗利の目安</div></div>`;

  const prows = PROCS.map((pn,i)=>{
    const pr = (p.processes||[]).find(q=>q.name===pn)||{};
    const h  = pr.hours||0, c = pr.cost||0;
    const pp = p.targetBudget>0?(c/p.targetBudget)*100:0;
    const mfc= pp>=20?'fr':pp>=10?'fa':'fg';
    return `<tr>
      <td><div class="pncell"><span class="pno">${i+1}</span><div><div>${x(pn)}</div><div class="psub">${x(pr.assignee||'未設定')}</div></div></div></td>
      <td><span class="mono">${h>0?h+'h':'<span class="nd">—</span>'}</span></td>
      <td>${c>0?`<span class="ccost">¥${f(c)}</span>`:'<span class="nd">—</span>'}</td>
      <td>${c>0?`<div class="mbwrap"><div class="mbar"><div class="mfill ${mfc}" style="width:${Math.min(pp*3,100)}%"></div></div><span class="ptxt">${pp.toFixed(1)}%</span></div>`:'<span class="nd" style="font-size:11px">—</span>'}</td>
    </tr>`;
  }).join('');

  const staffH = (p.staff||[]).map(s=>`
    <div class="schip">
      <div class="av">${s.name.slice(0,2)}</div>
      <span class="cname">${x(s.name)}</span>
      <span class="crate">¥${f(s.hourlyRate)}/h</span>
    </div>`).join('');

  const pOpts = ['すべての工程',...PROCS].map((n,i)=>`<option value="${i===0?'':n}">${x(n)}</option>`).join('');
  const sNames = [...new Set((p.logs||[]).map(l=>l.assignee).filter(Boolean))];
  const sOpts  = ['すべての担当者',...sNames].map((n,i)=>`<option value="${i===0?'':n}">${x(n)}</option>`).join('');

  return `
    <div class="dhead">
      <div class="dname">${x(p.name)}</div>
      <div class="dtags">
        <div class="dtag"><span class="badge ${bc}" style="border-radius:4px">${p.status||'進行中'}</span></div>
        <div class="dtag">メイン担当 <span>${x(p.manager||'未設定')}</span></div>
      </div>
    </div>
    <div class="kgrid">${kpis}</div>
    <div class="bbc">
      <div class="bbchead"><div class="bbctitle">目標予算 消化率</div><div class="bbcpct ${pct>=90?'cr':pct>=70?'ca':'cg'}">${Math.round(pct)}%</div></div>
      <div class="bigbar"><div class="bigfill ${fc}" style="width:${pcap}%"></div></div>
      <div class="bbcfoot"><span>使用 <b>¥${f(used)}</b></span><span>目標予算 <b>¥${f(p.targetBudget)}</b></span></div>
    </div>
    <div class="tabs">
      <button class="tab active" data-t="processes">工程別サマリー</button>
      <button class="tab" data-t="log">日別作業ログ</button>
      <button class="tab" data-t="staff">担当者</button>
    </div>
    <div id="tp-processes" class="tpanel active">
      <div class="twrap"><table><thead><tr><th>工程</th><th>作業時間</th><th>人件費</th><th>予算消化</th></tr></thead><tbody>${prows}</tbody></table></div>
    </div>
    <div id="tp-log" class="tpanel">
      <div class="lctrl2">
        <select class="sel" id="log-pf">${pOpts}</select>
        <select class="sel" id="log-sf">${sOpts}</select>
      </div>
      <div id="log-wrap"></div>
    </div>
    <div id="tp-staff" class="tpanel">
      <div class="stitle">この案件の担当者</div>
      <div class="srow">${staffH||'<span style="color:var(--text3);font-size:13px">担当者情報がありません</span>'}</div>
    </div>`;
}

function renderLog(p) {
  const pf = (document.getElementById('log-pf')||{}).value||'';
  const sf = (document.getElementById('log-sf')||{}).value||'';
  let logs = (p.logs||[]).filter(l => (!pf||l.process===pf) && (!sf||l.assignee===sf));
  logs.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const wrap = document.getElementById('log-wrap');
  if (!wrap) return;
  if (!logs.length) { wrap.innerHTML=`<div class="loading-wrap" style="padding:32px 0;font-size:13px">作業ログがありません</div>`; return; }
  const th = logs.reduce((s,l)=>s+(l.hours||0),0);
  const tc = logs.reduce((s,l)=>s+(l.cost||0),0);
  const rows = logs.map(l=>`<tr>
    <td><span class="mono">${x(l.date||'—')}</span></td>
    <td>${x(l.process||'—')}</td>
    <td>${x(l.assignee||'—')}</td>
    <td><span class="mono">${l.hours||0}h</span></td>
    <td><span class="ccost">¥${f(l.cost||0)}</span></td>
  </tr>`).join('');
  wrap.innerHTML=`<div class="twrap"><table>
    <thead><tr><th>日付</th><th>工程</th><th>担当者</th><th>時間</th><th>人件費</th></tr></thead>
    <tbody>${rows}
    <tr style="background:var(--bg3)">
      <td colspan="3" style="text-align:right;font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.4px;text-transform:uppercase">合計</td>
      <td><span class="mono" style="font-weight:600">${th}h</span></td>
      <td><span class="ccost" style="font-weight:600">¥${f(tc)}</span></td>
    </tr></tbody>
  </table></div>`;
}
